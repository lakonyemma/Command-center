name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: command-center-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Verify registered signing key
        shell: bash
        run: |
          EXPECTED_SHA1="B6:7D:A2:29:8B:1F:45:F9:BB:6D:C3:D1:A4:8C:A1:49:9A:82:44:9E"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | tee signing-report.txt
          ACTUAL_SHA1="$(grep "SHA1:" signing-report.txt | sed 's/^[[:space:]]*SHA1: //')"
          printf 'SHA1: %s\n' "$ACTUAL_SHA1" > signing-sha1.txt
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "Refusing to build: signing key does not match the Google OAuth registered certificate."
            exit 1
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lakony-command-center-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            signing-sha1.txt
          if-no-files-found: error
